<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OrgKompass</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OrgKompass">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #ffffff;
  --bg2: #f7f7f8;
  --border: #e2e2e4;
  --text: #1c1c1e;
  --muted: #8a8a8e;
  --icon: #a0a0a5;
  --accent: #2c2c2e;
  --green: #1f7a3d;
  --green-bg: #e3f5e9;
  --yellow: #92620a;
  --yellow-bg: #fdf0d8;
  --red: #b3261e;
  --red-bg: #fbe4e2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --bg2: #2c2c2e;
    --border: #3a3a3c;
    --text: #f5f5f7;
    --muted: #98989d;
    --icon: #98989d;
    --accent: #f5f5f7;
    --green: #4cd964;
    --green-bg: #123320;
    --yellow: #ffb340;
    --yellow-bg: #3a2a0d;
    --red: #ff6961;
    --red-bg: #3a1210;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
header .app-name { font-weight: 700; font-size: 1.05rem; }
.info-pill {
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.85rem;
  min-height: 32px;
}
main {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px calc(env(safe-area-inset-bottom) + 96px);
  position: relative;
}
.page-title { font-size: 1.4rem; margin: 4px 0 16px; }
.card-list { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
}
.module-card {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; text-align: left; cursor: pointer;
  min-height: 44px;
}
.module-card svg { color: var(--icon); flex-shrink: 0; margin-left: 8px; }
.module-card-title { font-weight: 600; }
.module-card-desc { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
.muted { color: var(--muted); }

.back-link {
  display: inline-flex; align-items: center; gap: 4px;
  background: none; border: none; color: var(--muted);
  font-size: 0.9rem; padding: 6px 0; margin-bottom: 4px; min-height: 32px;
}
.back-link svg { transform: rotate(180deg); }

.markdown h2 { font-size: 1.15rem; margin: 18px 0 8px; }
.markdown h3 { font-size: 1.02rem; margin: 14px 0 6px; }
.markdown p { line-height: 1.55; margin: 0 0 12px; }
.markdown strong { font-weight: 700; }
.markdown ul { padding-left: 20px; margin: 0 0 12px; }
.diagram { margin: 14px 0; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.diagram svg { width: 100%; height: auto; }

.btn-primary {
  width: 100%; padding: 14px; margin-top: 12px;
  background: var(--accent); color: var(--bg);
  border: none; border-radius: 12px;
  font-weight: 600; font-size: 1rem; min-height: 44px;
}
.btn-icon {
  background: var(--accent); color: var(--bg);
  border: none; border-radius: 10px; padding: 10px 14px;
  min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center;
}

.quiz-progress { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
.quiz-question { font-size: 1.2rem; margin: 0 0 16px; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.quiz-option {
  text-align: left; padding: 14px 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg2); color: var(--text);
  font-size: 1rem; min-height: 44px;
}
.quiz-option.correct { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.quiz-option.incorrect { background: var(--red-bg); color: var(--red); border-color: var(--red); }
.quiz-result-score { font-size: 1.4rem; font-weight: 700; }
.quiz-result-xp { color: var(--muted); }

.search-wrap { position: relative; margin-bottom: 14px; }
.search-input {
  width: 100%; padding: 12px 40px 12px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg2); color: var(--text);
  font-size: 1rem; min-height: 44px; -webkit-appearance: none;
}
.search-input::-webkit-search-cancel-button,
.search-input::-webkit-search-decoration {
  -webkit-appearance: none;
  appearance: none;
}
.search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--icon);
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
}
.glossary-card .module-card-title { font-weight: 600; }

.frage-input-wrap { display: flex; gap: 8px; margin-top: 12px; }
.frage-input-wrap .search-input { margin: 0; }
.frage-antwort { min-height: 40px; }

#tab-bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-around;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 6px 4px calc(env(safe-area-inset-bottom) + 6px);
  z-index: 20;
}
.tab-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; color: var(--icon);
  font-size: 0.68rem; padding: 4px 6px; min-height: 44px; min-width: 44px;
}
.tab-btn.active { color: var(--accent); }

#back-top {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 78px);
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: var(--bg); border: none;
  display: none; align-items: center; justify-content: center;
  z-index: 15;
}
#back-top.visible { display: flex; }

#ptr-indicator {
  position: absolute; top: 0; left: 50%; transform: translate(-50%, 0);
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--bg2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s; color: var(--muted);
  z-index: 5;
}

#info-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity .2s;
  z-index: 30;
}
#info-overlay.open { opacity: 1; pointer-events: auto; }
.info-sheet {
  background: var(--bg); width: 100%; max-height: 80vh; overflow-y: auto;
  border-radius: 18px 18px 0 0; padding: 16px 20px calc(env(safe-area-inset-bottom) + 20px);
}
.info-sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.info-sheet h2 { margin: 0; font-size: 1.1rem; }
.info-sheet p { line-height: 1.5; color: var(--text); }
.btn-logout {
  width: 100%; padding: 14px; margin-top: 16px;
  background: var(--red-bg); color: var(--red);
  border: none; border-radius: 12px; font-weight: 600; min-height: 44px;
}
.version-line { text-align: center; font-size: .75rem; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>

<header>
  <span class="app-name">OrgKompass</span>
  <button class="info-pill" id="info-btn">Info</button>
</header>

<main id="main">
  <div id="ptr-indicator">&#8635;</div>
</main>

<button id="back-top" aria-label="Nach oben"></button>
<nav id="tab-bar"></nav>

<div id="info-overlay">
  <div class="info-sheet">
    <div class="info-sheet-header">
      <h2>Info</h2>
      <button id="info-close" style="background:none;border:none;color:var(--muted)">✕</button>
    </div>
    <p>OrgKompass ist deine Lern-App für Organisationsberatung — mit Lerneinheiten, Quiz, Glossar und einer Lernzielanalyse zu Reorganisation, Strukturgestaltung, Funktionsbewertung und Change Management.</p>
    <button class="btn-logout" id="logout-btn">Abmelden</button>
    <p class="version-line">Version 1.0 · 2026-08-14</p>
  </div>
</div>

<script src="content/content-core.js"></script>
<script src="content/content-modul-01-grundlagen.js"></script>
<script src="content/content-modul-02-strukturgestaltung.js"></script>
<script src="content/content-modul-03-funktionsbewertung.js"></script>
<script src="content/content-modul-04-reorganisationsprojekte.js"></script>
<script src="content/content-modul-05-analyse-diagnostik.js"></script>
<script src="content/content-modul-06-prozessoptimierung.js"></script>
<script src="content/content-modul-07-co-creation.js"></script>
<script src="content/content-modul-08-change-management-1.js"></script>
<script src="content/content-modul-09-change-management-2.js"></script>
<script src="content/content-glossar.js"></script>
<script src="content/content-diagramme.js"></script>
<script src="app.js"></script>
</body>
</html>
