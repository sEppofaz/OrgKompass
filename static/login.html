<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OrgKompass – Login</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg:#ffffff; --bg2:#f7f7f8; --bg3:#ffffff; --border:#e2e2e4; --text:#1c1c1e; --muted:#8a8a8e;
  --accent:#2c2c2e; --accent-soft:#48484c; --accent-text:#ffffff; --red:#b3261e; --red-bg:#fbe4e2;
  --shadow-sm: 0 1px 2px rgba(28,28,30,.05), 0 1px 1px rgba(28,28,30,.04);
  --shadow-md: 0 6px 16px rgba(28,28,30,.08), 0 2px 5px rgba(28,28,30,.05);
  --shadow-lg: 0 16px 40px rgba(28,28,30,.16), 0 4px 12px rgba(28,28,30,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1c1c1e; --bg2:#262629; --bg3:#2f2f33; --border:#3a3a3c; --text:#f5f5f7; --muted:#98989d;
    --accent:#f5f5f7; --accent-soft:#d8d8dc; --accent-text:#1c1c1e; --red:#ff6961; --red-bg:#3a1210;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 6px 16px rgba(0,0,0,.35), 0 2px 5px rgba(0,0,0,.2);
    --shadow-lg: 0 16px 40px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}
.login-box {
  width: 100%; max-width: 340px; text-align: center;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 22px;
  padding: 40px 28px 32px; box-shadow: var(--shadow-lg);
}
.login-icon { width: 76px; height: 76px; border-radius: 22px; margin: 0 auto 22px; box-shadow: var(--shadow-md); }
h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -.01em; margin: 0 0 26px; }
input[type="password"] {
  width: 100%; padding: 14px 16px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--bg2); color: var(--text);
  font-size: 1rem; min-height: 48px; -webkit-appearance: none;
  transition: box-shadow .15s ease, border-color .15s ease;
}
input[type="password"]:focus { outline: none; border-color: var(--accent-soft); box-shadow: var(--shadow-sm); }
button {
  width: 100%; padding: 14px; margin-top: 14px;
  background: linear-gradient(155deg, var(--accent-soft), var(--accent)); color: var(--accent-text);
  border: none; border-radius: 14px; font-weight: 700; font-size: 1rem; min-height: 48px;
  box-shadow: var(--shadow-md);
  transition: box-shadow .15s ease, transform .15s ease;
}
button:active { transform: translateY(1px) scale(.99); box-shadow: var(--shadow-sm); }
.error {
  background: var(--red-bg); color: var(--red);
  border-radius: 12px; padding: 10px 14px; margin-top: 14px; font-size: 0.9rem;
}
</style>
</head>
<body>
<div class="login-box">
  <img class="login-icon" src="icon-192.png" alt="OrgKompass">
  <h1>OrgKompass</h1>
  <form method="POST" action="/orgkompass/login">
    <input type="password" name="password" placeholder="Passwort" autofocus required>
    <button type="submit">Anmelden</button>
  </form>
  <div id="error" class="error" style="display:none">Falsches Passwort.</div>
</div>
<script>
  if (new URLSearchParams(window.location.search).get('error')) {
    document.getElementById('error').style.display = 'block';
  }
</script>
</body>
</html>
