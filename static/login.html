<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OrgKompass – Login</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<style>
:root { --bg:#ffffff; --bg2:#f7f7f8; --border:#e2e2e4; --text:#1c1c1e; --muted:#8a8a8e; --accent:#2c2c2e; --red:#b3261e; --red-bg:#fbe4e2; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1c1c1e; --bg2:#2c2c2e; --border:#3a3a3c; --text:#f5f5f7; --muted:#98989d; --accent:#f5f5f7; --red:#ff6961; --red-bg:#3a1210; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.login-box { width: 100%; max-width: 340px; text-align: center; }
.login-icon { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px; }
h1 { font-size: 1.3rem; margin: 0 0 24px; }
input[type="password"] {
  width: 100%; padding: 14px 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg2); color: var(--text);
  font-size: 1rem; min-height: 48px; -webkit-appearance: none;
}
button {
  width: 100%; padding: 14px; margin-top: 12px;
  background: var(--accent); color: var(--bg);
  border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; min-height: 48px;
}
.error {
  background: var(--red-bg); color: var(--red);
  border-radius: 10px; padding: 10px 14px; margin-top: 14px; font-size: 0.9rem;
}
</style>
</head>
<body>
<div class="login-box">
  <img class="login-icon" src="icon-192.png" alt="OrgKompass">
  <h1>OrgKompass</h1>
  <form method="POST" action="/orgkompass/login">
    <input type="password" name="password" placeholder="Passwort" autofocus required>
    <button type="submit">Anmelden</button>
  </form>
  <div id="error" class="error" style="display:none">Falsches Passwort.</div>
</div>
<script>
  if (new URLSearchParams(window.location.search).get('error')) {
    document.getElementById('error').style.display = 'block';
  }
</script>
</body>
</html>
